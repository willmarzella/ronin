# -----------------------------------------------------------------------------
# Timeouts & Retry
# -----------------------------------------------------------------------------
timeouts:
  http_request: 30
  page_load: 45
  element_wait: 10
  implicit_wait: 10

retry:
  max_attempts: 3
  backoff_multiplier: 2.0
  jitter: true
