# -----------------------------------------------------------------------------
# Seek Profile Automation (Optional / Advanced)
# -----------------------------------------------------------------------------
# This is separate from selecting which uploaded resume is attached per
# application. It switches your *Seek profile copy* (headline/summary/skills)
# so recruiter profile views match the archetype batch you are applying with.
#
# Requirements:
# - Playwright installed: `pip install playwright`
# - Browser installed: `playwright install chromium`
#
# Tip: run `ronin profile debug` to open Playwright Inspector and copy stable
# locators into `seek_profile.automation.selectors` if the defaults don't work.
seek_profile:
  automation:
    enabled: false
    headless: false
    channel: "chrome"                        # Prefer real Chrome for persisted sessions
    user_data_dir: "~/.ronin/chrome_profile" # Reuse Selenium login cookies if possible
    profile_url: "https://au.seek.com/profile"
    resumes_url: "https://au.seek.com/profile/me/resume?mode=edit" # Resume documents management
    timeout_ms: 45000
    login_timeout_sec: 300
    slow_mo_ms: 0
    jitter: true
    # Selectors captured from the live profile page 2026-08 (data-automation
    # attributes are Seek's own stable hooks). Headline has no field of its
    # own — the updater prefixes it into the summary text.
    selectors:
      summary_edit_button: "[data-automation='summary-edit']"
      summary_input: "[data-automation='summary-input']"
      summary_save_button: "[data-automation='summary-save-button']"
      skills_edit_button: "[data-automation='skills-edit-link']"
      skills_input: "[data-automation='skills-tags-input']"
      skills_add_button: "[data-automation='add-skill-button']"
      skills_save_button: "[data-automation='skills-save-button']"
      skills_remove_buttons: "[data-automation='skills-form-drawer'] button[aria-label^='Remove skill']"
    min_delay_sec: 0.1
    max_delay_sec: 0.5

    # Optional: override individual element locators when Seek UI changes.
    # Keys used by the automation:
    # - edit_profile_button
    # - headline_edit_button / headline_input / headline_save_button
    # - summary_edit_button / summary_input / summary_save_button
    # - skills_edit_button / skills_input / skills_save_button
    # - skills_clear_button / skills_remove_buttons
    #
    # Resume upload automation (used by `ronin resume upload`):
    # - resumes_url
    # - resume_file_input
    # - upload_resume_button
    # - replace_resume_button
    #
    # Seek application automation (used by `ronin apply`):
    # - apply_resume_select  # CSS selector for the resume dropdown on apply form
    selectors: {}

  # Optional: auto-switch Seek profile to the dominant archetype before apply
  # when running `ronin run` (only if enabled).
  drift:
    enabled: false
    lookback_days: 14
    min_recent_samples: 8
    min_queue_samples: 4
    strict: false

  templates:
    # The four DE archetypes carry the operator-seat positioning (data by
    # title, energy/asset domain).
    builder:
      headline: "Analytics Engineer | dbt · Snowflake · Databricks · AWS · Python · SQL | Energy & Regulated Industries"
